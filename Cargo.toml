[workspace]
members = ["rlnc-simdx", "rlnc-simdx-bench"]
resolver = "2"

[workspace.package]
version     = "0.1.0"
edition     = "2021"
rust-version = "1.89"
license     = "Apache-2.0"
authors     = ["arryboom"]
repository  = "https://github.com/arryboom/rlnc-simdx"

[profile.release]
opt-level = 3
lto       = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto       = "thin"
codegen-units = 1
debug     = true
